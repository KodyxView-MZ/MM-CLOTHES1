<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mm clothes — indisponível</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fonte Gótica Clássica -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    
    <style>
        .font-old-english {
            font-family: 'UnifrakturMaguntia', serif;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-center items-center font-sans overflow-hidden">

    <!-- Container Principal -->
    <main class="text-center px-6 relative z-10 max-w-md w-full">
        
        <!-- Monograma Gigante no Fundo (Fusco) -->
        <div class="font-old-english text-zinc-950 text-[14rem] md:text-[26rem] absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 select-none pointer-events-none tracking-tighter opacity-40">
            mm
        </div>

        <!-- Tag de Estado (Fechado) -->
        <div class="inline-flex items-center gap-2 border border-zinc-900 bg-zinc-950 px-3 py-1 rounded-full text-[10px] tracking-widest uppercase text-zinc-500 mb-6">
            <span class="w-1.5 h-1.5 rounded-full bg-zinc-700"></span>
            Encerramento / Closed
        </div>

        <!-- Nome da Marca -->
        <h1 class="font-old-english text-6xl md:text-7xl tracking-wide lowercase text-zinc-400 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] select-none">
            mm clothes
        </h1>

        <!-- Mensagem Principal -->
        <p class="mt-6 text-xs md:text-sm tracking-[0.2em] uppercase text-zinc-500 font-medium">
            Este site já não está disponível.
        </p>
        
        <!-- Mensagem de Despedida / Esclarecimento -->
        <p class="mt-4 text-xs text-zinc-600 leading-relaxed max-w-xs mx-auto">
            Agradecemos a todos os que fizeram parte da nossa jornada e apoiaram a marca. As operações foram oficialmente encerradas.
        </p>

        <!-- Link de Contacto / Suporte (Opcional - caso precisem de falar contigo) -->
        <div class="mt-8 border-t border-zinc-900 pt-6">
            <p class="text-[10px] uppercase tracking-widest text-zinc-500">Contacto de Suporte</p>
            <a href="mailto:suporte@mmclothes.com" class="text-xs text-zinc-400 hover:text-white transition-colors duration-300 mt-1 inline-block lowercase tracking-wider">
                suporte@mmclothes.com
            </a>
        </div>

    </main>

    <!-- Rodapé Discreto -->
    <footer class="absolute bottom-6 text-[9px] tracking-widest text-zinc-700 uppercase z-10">
        &copy; mm clothes.
    </footer>

    <!-- Grid Layout de Fundo Mais Escuro e Discreto -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#0a0a0a_1px,transparent_1px),linear-gradient(to_bottom,#0a0a0a_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_50%,transparent_100%)] pointer-events-none z-0"></div>

</body>
</html>
